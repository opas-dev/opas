# ABOUTME: Verifies OPAS on pull requests, main pushes, and version-tag pushes.
# ABOUTME: Runs both database repository contracts and both production build targets.
name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run checks and database tests
        run: pnpm test

      - name: Build Next.js application
        run: pnpm build

      - name: Build Cloudflare Worker
        run: pnpm cf:build
