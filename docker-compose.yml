# ABOUTME: Runs the local OPAS services with values supplied by one .env file.
# ABOUTME: Requires a complete public origin and administrator configuration before startup.
services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-opas}
      POSTGRES_USER: ${POSTGRES_USER:-opas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-opas}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - opas-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
    environment:
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:?Set ADMIN_SESSION_SECRET in .env}
      DATABASE_URL: postgres://${POSTGRES_USER:-opas}:${POSTGRES_PASSWORD:-opas}@db:5432/${POSTGRES_DB:-opas}
      OPAS_DATABASE_DRIVER: postgres
      OPAS_SITE_URL: ${OPAS_SITE_URL:?Set OPAS_SITE_URL in .env}
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  opas-postgres:
