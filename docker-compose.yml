# ABOUTME: Runs the local OPAS services with values supplied by one .env file.
# ABOUTME: Requires a complete public origin and administrator configuration before startup.
services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-opas}
      POSTGRES_USER: ${POSTGRES_USER:-opas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-opas}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - opas-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
    environment:
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:?Set ADMIN_SESSION_SECRET in .env}
      CRON_SECRET: ${CRON_SECRET:?Set CRON_SECRET in .env}
      DATABASE_URL: postgres://${POSTGRES_USER:-opas}:${POSTGRES_PASSWORD:-opas}@db:5432/${POSTGRES_DB:-opas}
      OPAS_DATABASE_DRIVER: postgres
      OPAS_ANSWER_DAILY_BUDGET_MICRODOLLARS: ${OPAS_ANSWER_DAILY_BUDGET_MICRODOLLARS:-}
      OPAS_ANSWER_FALLBACK_INPUT_MICRODOLLARS_PER_MILLION_TOKENS: ${OPAS_ANSWER_FALLBACK_INPUT_MICRODOLLARS_PER_MILLION_TOKENS:-}
      OPAS_ANSWER_FALLBACK_OUTPUT_MICRODOLLARS_PER_MILLION_TOKENS: ${OPAS_ANSWER_FALLBACK_OUTPUT_MICRODOLLARS_PER_MILLION_TOKENS:-}
      OPAS_ANSWER_ANALYTICS_RETENTION_DAYS: ${OPAS_ANSWER_ANALYTICS_RETENTION_DAYS:-30}
      OPAS_ANSWER_INPUT_MICRODOLLARS_PER_MILLION_TOKENS: ${OPAS_ANSWER_INPUT_MICRODOLLARS_PER_MILLION_TOKENS:-}
      OPAS_ANSWER_LEASE_MILLISECONDS: ${OPAS_ANSWER_LEASE_MILLISECONDS:-}
      OPAS_ANSWER_MAXIMUM_CONCURRENCY: ${OPAS_ANSWER_MAXIMUM_CONCURRENCY:-}
      OPAS_ANSWER_MAXIMUM_INPUT_TOKENS: ${OPAS_ANSWER_MAXIMUM_INPUT_TOKENS:-}
      OPAS_ANSWER_OUTPUT_MICRODOLLARS_PER_MILLION_TOKENS: ${OPAS_ANSWER_OUTPUT_MICRODOLLARS_PER_MILLION_TOKENS:-}
      OPAS_ANSWER_TOPIC_GUARDRAILS: ${OPAS_ANSWER_TOPIC_GUARDRAILS:-}
      OPAS_ANALYTICS_REDACTION_PATTERNS: ${OPAS_ANALYTICS_REDACTION_PATTERNS:-[]}
      OPAS_EMBEDDING_API_KEY: ${OPAS_EMBEDDING_API_KEY:-}
      OPAS_EMBEDDING_DIMENSION: ${OPAS_EMBEDDING_DIMENSION:-}
      OPAS_EMBEDDING_DIMENSIONS_PARAMETER: ${OPAS_EMBEDDING_DIMENSIONS_PARAMETER:-false}
      OPAS_EMBEDDING_ENDPOINT: ${OPAS_EMBEDDING_ENDPOINT:-}
      OPAS_EMBEDDING_MODEL: ${OPAS_EMBEDDING_MODEL:-}
      OPAS_EMBED_PARENT_ORIGINS: ${OPAS_EMBED_PARENT_ORIGINS:-}
      OPAS_GENERATION_API_KEY: ${OPAS_GENERATION_API_KEY:-}
      OPAS_GENERATION_ENDPOINT: ${OPAS_GENERATION_ENDPOINT:-}
      OPAS_GENERATION_FALLBACK_API_KEY: ${OPAS_GENERATION_FALLBACK_API_KEY:-}
      OPAS_GENERATION_FALLBACK_ENABLED: ${OPAS_GENERATION_FALLBACK_ENABLED:-false}
      OPAS_GENERATION_FALLBACK_ENDPOINT: ${OPAS_GENERATION_FALLBACK_ENDPOINT:-}
      OPAS_GENERATION_FALLBACK_GATEWAY_ID: ${OPAS_GENERATION_FALLBACK_GATEWAY_ID:-}
      OPAS_GENERATION_FALLBACK_MODEL: ${OPAS_GENERATION_FALLBACK_MODEL:-}
      OPAS_GENERATION_FALLBACK_PROVIDER: ${OPAS_GENERATION_FALLBACK_PROVIDER:-}
      OPAS_GENERATION_FALLBACK_RETENTION_DISCLOSURE: ${OPAS_GENERATION_FALLBACK_RETENTION_DISCLOSURE:-}
      OPAS_GENERATION_MODEL: ${OPAS_GENERATION_MODEL:-}
      OPAS_GENERATION_RETENTION_DISCLOSURE: ${OPAS_GENERATION_RETENTION_DISCLOSURE:-}
      OPAS_HANDOFF_CLOUDFLARE_ACCOUNT_ID: ${OPAS_HANDOFF_CLOUDFLARE_ACCOUNT_ID:-}
      OPAS_HANDOFF_CLOUDFLARE_API_TOKEN: ${OPAS_HANDOFF_CLOUDFLARE_API_TOKEN:-}
      OPAS_HANDOFF_DAILY_LIMIT: ${OPAS_HANDOFF_DAILY_LIMIT:-100}
      OPAS_HANDOFF_FROM_EMAIL: ${OPAS_HANDOFF_FROM_EMAIL:-}
      OPAS_HANDOFF_PROVIDER: ${OPAS_HANDOFF_PROVIDER:-}
      OPAS_HANDOFF_RETENTION_DAYS: ${OPAS_HANDOFF_RETENTION_DAYS:-30}
      OPAS_HANDOFF_TO_EMAIL: ${OPAS_HANDOFF_TO_EMAIL:-}
      OPAS_HANDOFF_WEBHOOK_TOKEN: ${OPAS_HANDOFF_WEBHOOK_TOKEN:-}
      OPAS_HANDOFF_WEBHOOK_URL: ${OPAS_HANDOFF_WEBHOOK_URL:-}
      OPAS_SITE_URL: ${OPAS_SITE_URL:?Set OPAS_SITE_URL in .env}
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  app-maintenance:
    profiles: ["maintenance"]
    build:
      context: .
      target: maintenance
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-opas}:${POSTGRES_PASSWORD:-opas}@db:5432/${POSTGRES_DB:-opas}
      OPAS_DATABASE_DRIVER: postgres
      OPAS_EMBED_PARENT_ORIGINS: ${OPAS_EMBED_PARENT_ORIGINS:-}
      OPAS_PUBLIC_PROFILE: ${OPAS_PUBLIC_PROFILE:-opas}
      OPAS_SITE_URL: ${OPAS_SITE_URL:?Set OPAS_SITE_URL in .env}
    ports:
      - "${MAINTENANCE_APP_PORT:-3001}:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  embedding-recovery:
    build:
      context: .
    command: ["node", "scripts/run-embedding-recovery.mjs"]
    environment:
      CRON_SECRET: ${CRON_SECRET:?Set CRON_SECRET in .env}
      OPAS_EMBEDDING_RECOVERY_INTERVAL_MS: ${OPAS_EMBEDDING_RECOVERY_INTERVAL_MS:-30000}
      OPAS_EMBEDDING_RECOVERY_URL: http://app:3000/api/internal/embeddings
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  analytics-cleanup:
    build:
      context: .
    command: ["node", "scripts/run-analytics-cleanup.mjs"]
    environment:
      CRON_SECRET: ${CRON_SECRET:?Set CRON_SECRET in .env}
      OPAS_ANALYTICS_CLEANUP_INTERVAL_MS: ${OPAS_ANALYTICS_CLEANUP_INTERVAL_MS:-21600000}
      OPAS_ANALYTICS_CLEANUP_URL: http://app:3000/api/internal/analytics
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

volumes:
  opas-postgres:
